name: Installers

# Pushing a version tag (e.g. v0.1.0) builds the installers on all three OSes
# and attaches them to a draft GitHub release. Changing this file on a branch
# builds them too, as downloadable run artifacts, so the setup can be checked.
on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - .github/workflows/release.yml
  workflow_dispatch:

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            args: ""
          - name: macOS
            os: macos-latest
            # One app that runs natively on both Apple Silicon and Intel Macs.
            args: --target universal-apple-darwin
          - name: Windows
            os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # The Azure login for Windows signing trusts this repo's "release" environment.
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_WINDOWS_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match app version $version in tauri.conf.json"
            exit 1
          fi

      # Built on the oldest supported Ubuntu so the .deb and AppImage run on more distros.
      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev file rpm

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: installers

      - run: npm ci

      # Signing only happens once the secrets are added in the repo settings.
      # Without them the Mac app is ad-hoc signed and Windows is unsigned.
      - name: Set up Mac signing
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # The multi-line form keeps a value that spans lines (a wrapped base64
        # certificate) whole, where name=value would keep only its first line.
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            delimiter="ACM_$(openssl rand -hex 8)"
            printf '%s<<%s\n%s\n%s\n' "$name" "$delimiter" "${!name}" "$delimiter" >> "$GITHUB_ENV"
          done

      # Windows signing uses Azure Artifact Signing, logged in through GitHub
      # (no stored password). Tauri calls the sign script for the app and for
      # each installer, after it has finished changing each file.
      - name: Log in to Azure
        if: runner.os == 'Windows' && env.HAS_WINDOWS_SIGNING == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Windows signing
        if: runner.os == 'Windows' && env.HAS_WINDOWS_SIGNING == 'true'
        run: |
          pwsh -NoProfile -Command "Install-Module -Name ArtifactSigning -RequiredVersion 0.1.8 -Force -Scope CurrentUser -Repository PSGallery"
          script=$(cygpath -m "$GITHUB_WORKSPACE/scripts/sign-windows.ps1")
          cat > "$RUNNER_TEMP/sign.json" <<JSON
          { "bundle": { "windows": { "signCommand": {
            "cmd": "pwsh",
            "args": ["-NoProfile", "-File", "$script", "%1"]
          } } } }
          JSON
          cat "$RUNNER_TEMP/sign.json"
          echo "SIGN_ARGS=--config $RUNNER_TEMP/sign.json" >> "$GITHUB_ENV"

      - name: Build installers
        timeout-minutes: 30
        run: npx tauri build ${{ matrix.args }} $SIGN_ARGS

      - name: Check the Windows signatures
        if: runner.os == 'Windows' && env.HAS_WINDOWS_SIGNING == 'true'
        shell: pwsh
        run: |
          $files = Get-ChildItem src-tauri/target/release/bundle -Recurse -Include *.msi, *-setup.exe
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            "$($f.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "$($f.Name) is not validly signed" }
          }

      # Tauri notarizes the app inside, but the .dmg needs its own ticket
      # so macOS doesn't warn when someone opens the download.
      - name: Notarize the Mac disk image
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        run: |
          dmg=$(find src-tauri/target -path '*/release/bundle/dmg/*.dmg' | head -1)
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD" --wait
          xcrun stapler staple "$dmg"

      - name: Collect installers
        run: |
          mkdir -p out
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) \
            -exec cp {} out/ \;
          ls -l out
          [ -n "$(ls out)" ] || { echo "::error::No installers were built"; exit 1; }

      - uses: actions/upload-artifact@v5
        with:
          name: installers-${{ matrix.name }}
          path: out/*
          retention-days: 14

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: installers-*
          path: out
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Agent Context Monitor $GITHUB_REF_NAME" \
            --generate-notes
