<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Agent Context Monitor</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <header>
      <nav role="tablist" aria-label="Views">
        <button role="tab" id="tab-usage" aria-controls="panel-usage" aria-selected="true">Usage</button>
        <button role="tab" id="tab-context" aria-controls="panel-context" aria-selected="false" tabindex="-1">
          Context
        </button>
      </nav>
    </header>
    <main>
      <section role="tabpanel" id="panel-usage" aria-labelledby="tab-usage"></section>
      <section role="tabpanel" id="panel-context" aria-labelledby="tab-context" hidden></section>
    </main>
  </body>
</html>
