[package]
name = "agent-context-monitor"
version = "0.1.2"
description = "Tray app showing Claude Code and Codex usage and context left"
authors = ["Brad Traversy"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix keeps the library name apart from the app's on Windows.
name = "agent_context_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ureq = { version = "3", features = ["json"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
